<!DOCTYPE html>
<html lang="pt-br">
<head>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Paínel De Notícias</title>
    <link rel="stylesheet" href="styles/index.css">

    <link href="https://fonts.googleapis.com/css2?family=Archivo:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
</head>
<body> 
    <header class="container">
        <nav id="primary" class="grid grid-column">
           <div>
                <img src="assets/icons/List.svg" alt="icone de lista">
               <strong>Menu</strong>
           </div>

           <div>
                <img src="assets/icons/Tech News.png" alt="logo tech news">
           </div>

           <div>
                <strong>Buscar</strong>

        </nav>

        <nav id="secundary" class="grid grid-column">
            <a href="#">Inteligência Artificial</a>

        <section id="destaque" class="grid-column grid gap-16">
          <figure class="card">
            <img src="assets/image/Image 01.png" alt="imagem de um robo">

            <figcaption>
            <span class="content-tag">ROBÓTICA</span>
            <h2 class="text-h1">Robôs domésticos começam a ser adotados para tarefas diárias,

            </figcaption>
          </figure>

          <div class="grid grid-column-2 gap-16">
            <figure class="card">
              <img src="assets/image/Image 02.png" alt="uma pessoa com celular na mão">
              
              <figcaption>
                <span class="content-tag">HOLOGRAMAS</span>
                <h2 class="text-h3">Novo Smartphone Projetor 3D chega ao mercado, transformando
                   a forma como vemos nossas telas!</h2>
                </figcaption>
            </figure>

            <figure class="card">
              <img src="assets/image/Image 03.png" alt="uma imagem da rede 6g">

              <figcaption>
                <span class="content-tag">INTERNET</span>
                <h2 class="text-h3">Tecnologia 6G chega às metrópoles
                   brasileiras, prometendo revolucionar a forma como vivemos e nos comuni...</h2>
                </figcaption>
            </figure>

            <figure class="card">
              <img src="assets/image/Image 04.png" alt="uma mulher olhando um relogio">

              <figcaption>
                <span class="content-tag">VESTÍVEIS</span>
                <h2 class="text-h3">Empresa lança relógio inteligente capaz de monitorar a 
                  saúde mental, oferecendo insights valiosos para o...</h2>
                </figcaption>
            </figure>

            <figure class="card">
              <img src="assets/image/Image 05.png" alt="2 crianças usando oculos VR">

              <figcaption>
                <span class="content-tag">REALIDADE VIRTUAL</span>
                <h2 class="text-h3">Escolas adotam a tecnologia 
                  VR para proporcionar experiências imersivas, transformando a 
                  aprendizagem trad...</h2>
                </figcaption>
            </figure>
          </div>
        </section>

        <section id="mais-lidos" class="grid grid-column gap-16">
           <div>
            <img src="assets/image/Image 06.png" alt="imagem de um automovel futuristico"> 
          </div>

           <div>
            <img src="assets/image/Image 07.png" alt="uma pessoa com hologramas">
          </div>

           <div>
            <img src="assets/image/Image 08.png" alt="um menino usando oculos vr">
          </div>

           <div>
            <img src="assets/image/Image 09.png" alt="um satélite no espaço">
          </div>

</html>
